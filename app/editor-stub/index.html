<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에디터 자리 (stub)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./stub.css">
<script type="module" src="./stub.js"></script>
</head>
<body data-mode="edit">

<header class="menu">
  <div class="lang">
    <button type="button" class="lang-btn" id="langBtn" title="언어">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="9" cy="9" r="8"/><ellipse cx="9" cy="9" rx="3.5" ry="8"/><path d="M1 9h16"/></svg>▾
    </button>
    <div class="lang-menu" id="langMenu" hidden>
      <button type="button" data-locale="ko">한국어</button>
      <button type="button" data-locale="en">English</button>
    </div>
  </div>
  <div class="menu-item" data-i18n="file">파일</div>
  <div class="menu-item" data-i18n="edit">편집</div>
  <div class="spacer"></div>
  <div class="edit-only save-status" id="saveStatus" data-status="saved"><span class="save-icon"></span><span id="saveLabel">저장됨</span></div>
  <button type="button" class="edit-only retry" id="retryBtn" hidden>다시 시도</button>
  <button type="button" class="edit-only save-btn" id="saveBtn">저장하기</button>
</header>

<div class="main">
  <section class="code edit-view">
    <div class="tabs">
      <div class="tab is-active" data-i18n="code">코드</div>
      <div class="tab" data-i18n="costumes">모양</div>
      <div class="tab" data-i18n="sounds">소리</div>
    </div>
    <div class="code-body">
      <div class="cats" id="cats"></div>
      <div class="flyout"></div>
      <div class="workspace" id="workspace">
        <div class="stub-note">
          <strong>에디터 자리 (stub)</strong>
          <span>실제 에디터는 TurboWarp 포크 빌드를 이 iframe에 띄웁니다. 지금은 메시지 규약만 흉내 냅니다.</span>
          <label>채점 결과
            <select id="gradeResult">
              <option value="pass">통과</option>
              <option value="fail">실패</option>
              <option value="error">오류</option>
              <option value="timeout">응답 없음</option>
            </select>
          </label>
          <button type="button" id="changeBtn">작품 바꾸기 (projectChanged)</button>
          <span id="projectInfo"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="side">
    <div class="controls">
      <div class="flag">⚑</div>
      <div class="stop"><span></span></div>
    </div>
    <canvas class="stage" id="stage" width="480" height="360"></canvas>
    <div class="targets edit-view">
      <div class="sprites"><div class="sprites-head" data-i18n="sprite">스프라이트</div></div>
      <div class="backdrop" data-i18n="stage">무대</div>
    </div>
  </section>
</div>

</body>
</html>
