<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크래치 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/translations-all.js"></script>
<script type="module" src="./main.js"></script>
</head>
<body>
<div id="app" class="ss">

  <aside id="strip" class="ss-strip" hidden>
    <button type="button" class="ss-icon-btn" data-action="exit" title="종료">
      <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9"/><path d="M12 8H1.5M5 4.5 1.5 8 5 11.5"/></svg>
    </button>
    <div class="ss-strip-rule"></div>
    <button type="button" class="ss-icon-btn" data-action="open" title="교안 열기">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.75"><rect x=".9" y=".9" width="16.2" height="12.2" rx="2.2"/><path d="M6.5 1v12"/></svg>
    </button>
    <div class="ss-strip-dots">
      <div class="ss-dots" data-dots></div>
      <div class="ss-strip-label" id="stepShort"></div>
    </div>
  </aside>

  <aside id="panel" class="ss-panel">
    <div class="ss-top">
      <button type="button" class="ss-exit" data-action="exit">
        <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9"/><path d="M12 8H1.5M5 4.5 1.5 8 5 11.5"/></svg>
        종료
      </button>
      <div class="ss-top-rule"></div>
      <div class="ss-unit-title" id="unitTitle"></div>
      <button type="button" class="ss-icon-btn" data-action="close" title="교안 접기">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.75"><rect x=".9" y=".9" width="16.2" height="12.2" rx="2.2"/><path d="M1 1h5.5v12H1z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="ss-progress">
      <div class="ss-dots" data-dots></div>
      <span class="ss-step-label" id="stepLabel"></span>
    </div>
    <div class="ss-body" id="body"></div>
    <div class="ss-band" id="band" hidden><span class="ss-band-icon" id="bandIcon"></span><span id="bandText"></span></div>
    <div class="ss-actions" id="actions">
      <button type="button" class="ss-btn-secondary" id="prevBtn"></button>
      <button type="button" class="ss-btn-primary" id="primaryBtn"></button>
    </div>
  </aside>

  <div id="resizer" class="ss-resizer" title="끌어서 너비 조절"><div></div></div>

  <main class="ss-editor">
    <div class="ss-loading" id="editorLoading">
      <span class="ss-spinner ss-spinner-lg"></span>
      <div class="ss-loading-title">에디터를 불러오는 중이에요</div>
      <div class="ss-loading-sub">잠시만 기다려 주세요</div>
    </div>
    <iframe id="editor" title="스크래치 에디터" allow="clipboard-write"></iframe>
  </main>

</div>
</body>
</html>
